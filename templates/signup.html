<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up | AI Traffic & Parking Intelligence</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


    <style>

        /* ==========================================
           BASIC RESET
        ========================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            font-family: "Inter", sans-serif;

            min-height: 100vh;

            background: #050b10;

            color: white;

        }


        /* ==========================================
           MAIN PAGE
        ========================================== */

        .signup-page {

            min-height: 100vh;

            width: 100%;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 40px 20px;

            position: relative;

            overflow: hidden;


            /* ======================================
               YOUR BACKGROUND IMAGE

               Replace this URL with your image.

               Recommended:

               url("/static/images/signup-bg.jpg")

               ====================================== */

            background-image:

                linear-gradient(
                    90deg,
                    rgba(3,10,15,0.94),
                    rgba(3,10,15,0.75),
                    rgba(3,10,15,0.48)
                ),

                url("https://images.unsplash.com/photo-1449824913935-59a10b8d2000?auto=format&fit=crop&w=1800&q=85");

            background-size: cover;

            background-position: center;

            background-attachment: fixed;

        }


        /* ==========================================
           GREEN BACKGROUND GLOW
        ========================================== */

        .signup-page::before {

            content: "";

            position: absolute;

            width: 500px;

            height: 500px;

            border-radius: 50%;

            background:
                rgba(0,230,118,0.08);

            filter:
                blur(120px);

            top: -200px;

            right: -150px;

            pointer-events: none;

        }


        /* ==========================================
           MAIN SIGNUP CARD
        ========================================== */

        .signup-card {

            width: 500px;

            max-width: 100%;

            padding: 38px 42px;

            position: relative;

            z-index: 2;

            border-radius: 20px;


            /* GLASS EFFECT */

            background:

                linear-gradient(
                    145deg,
                    rgba(10,22,29,0.95),
                    rgba(5,13,18,0.88)
                );


            border:
                1px solid
                rgba(255,255,255,0.13);


            backdrop-filter:
                blur(22px);

            -webkit-backdrop-filter:
                blur(22px);


            /* SHADOW */

            box-shadow:

                0 35px 80px
                rgba(0,0,0,0.60),

                0 0 40px
                rgba(0,230,118,0.04),

                inset 0 1px 0
                rgba(255,255,255,0.07);

        }


        /* ==========================================
           TOP GREEN GLOW LINE
        ========================================== */

        .signup-card::before {

            content: "";

            position: absolute;

            top: 0;

            left: 10%;

            width: 80%;

            height: 1px;

            background:

                linear-gradient(
                    90deg,
                    transparent,
                    #00e676,
                    transparent
                );

            box-shadow:
                0 0 15px
                rgba(0,230,118,0.6);

        }


        /* ==========================================
           LOGO
        ========================================== */

        .logo {

            display: flex;

            align-items: center;

            gap: 12px;

            margin-bottom: 22px;

        }


        .logo-icon {

            width: 46px;

            height: 46px;

            border-radius: 13px;

            display: flex;

            align-items: center;

            justify-content: center;

            color: #00e676;

            background:
                rgba(0,230,118,0.08);

            border:
                1px solid
                rgba(0,230,118,0.25);

            box-shadow:
                0 0 25px
                rgba(0,230,118,0.10);

            font-size: 20px;

        }


        .logo-text {

            font-size: 13px;

            line-height: 1.35;

            font-weight: 700;

        }


        .logo-text span {

            color: #00e676;

        }


        /* ==========================================
           CREATE ACCOUNT ICON
        ========================================== */

        .signup-icon {

            width: 55px;

            height: 55px;

            border-radius: 15px;

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                rgba(0,230,118,0.09);

            border:
                1px solid
                rgba(0,230,118,0.25);

            color: #00e676;

            font-size: 23px;

            margin-bottom: 18px;

            box-shadow:
                0 0 25px
                rgba(0,230,118,0.10);

        }


        /* ==========================================
           HEADING
        ========================================== */

        .signup-card h1 {

            font-size: 27px;

            font-weight: 800;

            margin-bottom: 7px;

            letter-spacing: -0.5px;

        }


        .subtitle {

            color: #89969e;

            font-size: 12px;

            line-height: 1.5;

            margin-bottom: 24px;

        }


        /* ==========================================
           FORM GRID
        ========================================== */

        .form-grid {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 15px;

        }


        .full-width {

            grid-column:
                1 / -1;

        }


        /* ==========================================
           INPUT GROUP
        ========================================== */

        .input-group {

            margin-bottom: 2px;

        }


        .input-group label {

            display: block;

            font-size: 11px;

            color: #d5dde1;

            margin-bottom: 7px;

            font-weight: 600;

        }


        /* ==========================================
           INPUT WRAPPER
        ========================================== */

        .input-wrapper {

            position: relative;

        }


        .input-wrapper input {

            width: 100%;

            height: 46px;

            padding:
                0 42px;

            border-radius: 9px;

            border:
                1px solid
                rgba(255,255,255,0.13);

            background:
                rgba(255,255,255,0.035);

            color: white;

            outline: none;

            font-family: inherit;

            font-size: 12px;

            transition:
                all 0.25s ease;

            box-shadow:
                inset 0 1px 2px
                rgba(0,0,0,0.25);

        }


        /* ==========================================
           SELECT
        ========================================== */

        .input-wrapper select {

            width: 100%;

            height: 46px;

            padding:
                0 42px;

            border-radius: 9px;

            border:
                1px solid
                rgba(255,255,255,0.13);

            background:
                rgba(255,255,255,0.035);

            color: white;

            outline: none;

            font-family: inherit;

            font-size: 12px;

            cursor: pointer;

            transition:
                all 0.25s ease;

        }


        .input-wrapper select option {

            background: #071016;

            color: white;

        }


        /* ==========================================
           ICON
        ========================================== */

        .input-icon {

            position: absolute;

            left: 15px;

            top: 50%;

            transform:
                translateY(-50%);

            color: #6e7c84;

            font-size: 13px;

            pointer-events: none;

            transition:
                0.25s ease;

            z-index: 2;

        }


        /* ==========================================
           INPUT FOCUS
        ========================================== */

        .input-wrapper input:focus,
        .input-wrapper select:focus {

            border-color:
                #00e676;

            background:
                rgba(0,230,118,0.045);

            box-shadow:

                0 0 0 3px
                rgba(0,230,118,0.08),

                0 0 20px
                rgba(0,230,118,0.08);

        }


        .input-wrapper input:focus ~ .input-icon,
        .input-wrapper select:focus ~ .input-icon {

            color: #00e676;

        }


        /* ==========================================
           PLACEHOLDER
        ========================================== */

        input::placeholder {

            color: #64727a;

        }


        /* ==========================================
           PASSWORD EYE
        ========================================== */

        .password-toggle {

            position: absolute;

            right: 14px;

            top: 50%;

            transform:
                translateY(-50%);

            color: #68767e;

            cursor: pointer;

            transition:
                0.2s;

        }


        .password-toggle:hover {

            color: #00e676;

        }


        /* ==========================================
           AGE INFORMATION
        ========================================== */

        .age-note {

            color: #65737b;

            font-size: 9px;

            margin-top: 5px;

        }


        /* ==========================================
           TERMS
        ========================================== */

        .terms {

            display: flex;

            align-items: flex-start;

            gap: 9px;

            margin:
                18px 0 20px;

            color: #78858c;

            font-size: 10px;

            line-height: 1.5;

        }


        .terms input {

            appearance: none;

            width: 14px;

            height: 14px;

            min-width: 14px;

            border-radius: 4px;

            border:
                1px solid #59666d;

            background: transparent;

            cursor: pointer;

            position: relative;

            margin-top: 1px;

        }


        .terms input:checked {

            background:
                #00e676;

            border-color:
                #00e676;

        }


        .terms input:checked::after {

            content: "✓";

            position: absolute;

            color: #03120a;

            font-size: 10px;

            font-weight: bold;

            left: 2px;

            top: -1px;

        }


        .terms a {

            color: #00e676;

            text-decoration: none;

            font-weight: 600;

        }


        .terms a:hover {

            text-decoration: underline;

        }


        /* ==========================================
           CREATE ACCOUNT BUTTON
        ========================================== */

        .signup-btn {

            width: 100%;

            height: 48px;

            border: none;

            border-radius: 9px;

            background:

                linear-gradient(
                    135deg,
                    #00c853,
                    #00e676
                );

            color: #03120a;

            font-size: 12px;

            font-weight: 800;

            cursor: pointer;

            transition:
                all 0.25s ease;

            box-shadow:

                0 8px 25px
                rgba(0,230,118,0.20);

        }


        .signup-btn:hover {

            transform:
                translateY(-2px);

            box-shadow:

                0 12px 35px
                rgba(0,230,118,0.30);

        }


        .signup-btn:active {

            transform:
                translateY(0);

        }


        /* ==========================================
           LOGIN LINK
        ========================================== */

        .login-text {

            text-align: center;

            margin-top: 19px;

            color: #7f8b91;

            font-size: 11px;

        }


        .login-text a {

            color: #00e676;

            text-decoration: none;

            font-weight: 700;

            margin-left: 4px;

        }


        .login-text a:hover {

            text-decoration: underline;

        }


        /* ==========================================
           SECURITY
        ========================================== */

        .security {

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 7px;

            margin-top: 16px;

            color: #536169;

            font-size: 9px;

        }


        .security i {

            color: #00c853;

        }


        /* ==========================================
           MOBILE
        ========================================== */

        @media (max-width: 600px) {

            .signup-page {

                padding:
                    25px 15px;

            }


            .signup-card {

                padding:
                    30px 23px;

            }


            .form-grid {

                grid-template-columns:
                    1fr;

                gap: 14px;

            }


            .full-width {

                grid-column:
                    auto;

            }


            .signup-card h1 {

                font-size: 24px;

            }

        }

    </style>

</head>


<body>


<!-- ==========================================
     SIGNUP PAGE
========================================== -->

<div class="signup-page">


    <!-- ======================================
         SIGNUP CARD
    ======================================= -->

    <div class="signup-card">


        <!-- ==================================
             LOGO
        =================================== -->

        <div class="logo">

            <div class="logo-icon">

                <i class="fa-solid fa-car-side"></i>

            </div>


            <div class="logo-text">

                AI Traffic &

                <span>Parking Intelligence</span>

            </div>

        </div>



        <!-- ==================================
             ICON
        =================================== -->

        <div class="signup-icon">

            <i class="fa-solid fa-user-plus"></i>

        </div>



        <!-- ==================================
             TITLE
        =================================== -->

        <h1>
            Create Account
        </h1>


        <p class="subtitle">

            Sign up to get started with
            AI traffic & parking intelligence.

        </p>



        <!-- ==================================
             FORM
        =================================== -->

        <form
            action="{{ url_for('signup') }}"
            method="POST"
            id="signupForm">


            <div class="form-grid">


                <!-- ==========================
                     FULL NAME
                =========================== -->

                <div class="input-group full-width">

                    <label for="fullname">
                        Full Name
                    </label>


                    <div class="input-wrapper">

                        <i class="fa-solid fa-user input-icon"></i>

                        <input
                            type="text"
                            id="fullname"
                            name="fullname"
                            placeholder="Enter your full name"
                            required
                        >

                    </div>

                </div>



                <!-- ==========================
                     EMAIL
                =========================== -->

                <div class="input-group">

                    <label for="email">
                        Email Address
                    </label>


                    <div class="input-wrapper">

                        <i class="fa-solid fa-envelope input-icon"></i>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            required
                        >

                    </div>

                </div>



                <!-- ==========================
                     MOBILE
                =========================== -->

                <div class="input-group">

                    <label for="mobile">
                        Mobile Number
                    </label>


                    <div class="input-wrapper">

                        <i class="fa-solid fa-phone input-icon"></i>

                        <input
                            type="tel"
                            id="mobile"
                            name="mobile"
                            placeholder="Enter mobile number"
                            pattern="[0-9]{10}"
                            maxlength="10"
                            required
                        >

                    </div>

                </div>



                <!-- ==========================
                     LOCATION
                =========================== -->

                <div class="input-group">

                    <label for="location">
                        Location
                    </label>


                    <div class="input-wrapper">

                        <i class="fa-solid fa-location-dot input-icon"></i>

                        <input
                            type="text"
                            id="location"
                            name="location"
                            placeholder="Enter your location"
                            required
                        >

                    </div>

                </div>



                <!-- ==========================
                     AGE
                =========================== -->

                <div class="input-group">

                    <label for="age">
                        Age
                    </label>


                    <div class="input-wrapper">

                        <i class="fa-solid fa-calendar-days input-icon"></i>

                        <input
                            type="number"
                            id="age"
                            name="age"
                            placeholder="Enter your age"
                            min="21"
                            max="100"
                            required
                        >

                    </div>


                    <div class="age-note">

                        Minimum age: 21 years

                    </div>

                </div>



                <!-- ==========================
                     PASSWORD
                =========================== -->

                <div class="input-group">

                    <label for="password">
                        Password
                    </label>


                    <div class="input-wrapper">

                        <i class="fa-solid fa-lock input-icon"></i>


                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Create a password"
                            minlength="6"
                            required
                        >


                        <i
                            class="fa-solid fa-eye password-toggle"
                            id="togglePassword">
                        </i>

                    </div>

                </div>



                <!-- ==========================
                     CONFIRM PASSWORD
                =========================== -->

                <div class="input-group">

                    <label for="confirm_password">
                        Confirm Password
                    </label>


                    <div class="input-wrapper">

                        <i class="fa-solid fa-lock input-icon"></i>


                        <input
                            type="password"
                            id="confirm_password"
                            name="confirm_password"
                            placeholder="Confirm your password"
                            minlength="6"
                            required
                        >


                        <i
                            class="fa-solid fa-eye password-toggle"
                            id="toggleConfirmPassword">
                        </i>

                    </div>

                </div>


            </div>



            <!-- ==================================
                 TERMS
            =================================== -->

            <label class="terms">

                <input
                    type="checkbox"
                    name="terms"
                    required
                >


                <span>

                    I agree to the

                    <a href="#">
                        Terms & Conditions
                    </a>

                    and

                    <a href="#">
                        Privacy Policy
                    </a>

                </span>

            </label>



            <!-- ==================================
                 BUTTON
            =================================== -->

            <button
                type="submit"
                class="signup-btn">

                <i class="fa-solid fa-user-plus"></i>

                &nbsp;

                Create Account

            </button>


        </form>



        <!-- ==================================
             LOGIN LINK
        =================================== -->

        <div class="login-text">

            Already have an account?

            <a href="{{ url_for('login') }}">
                Login
            </a>

        </div>



        <!-- ==================================
             SECURITY
        =================================== -->

        <div class="security">

            <i class="fa-solid fa-shield-halved"></i>

            Your information is securely protected

        </div>


    </div>

</div>



<!-- ==========================================
     JAVASCRIPT
========================================== -->

<script>


    /* ======================================
       PASSWORD SHOW / HIDE
    ======================================= */

    const togglePassword =
        document.getElementById(
            "togglePassword"
        );

    const password =
        document.getElementById(
            "password"
        );


    togglePassword.addEventListener(
        "click",
        function () {

            if (
                password.type === "password"
            ) {

                password.type = "text";

                this.classList.remove(
                    "fa-eye"
                );

                this.classList.add(
                    "fa-eye-slash"
                );

            }

            else {

                password.type =
                    "password";

                this.classList.remove(
                    "fa-eye-slash"
                );

                this.classList.add(
                    "fa-eye"
                );

            }

        }
    );



    /* ======================================
       CONFIRM PASSWORD SHOW / HIDE
    ======================================= */

    const toggleConfirmPassword =
        document.getElementById(
            "toggleConfirmPassword"
        );


    const confirmPassword =
        document.getElementById(
            "confirm_password"
        );


    toggleConfirmPassword.addEventListener(
        "click",
        function () {

            if (
                confirmPassword.type ===
                "password"
            ) {

                confirmPassword.type =
                    "text";

                this.classList.remove(
                    "fa-eye"
                );

                this.classList.add(
                    "fa-eye-slash"
                );

            }

            else {

                confirmPassword.type =
                    "password";

                this.classList.remove(
                    "fa-eye-slash"
                );

                this.classList.add(
                    "fa-eye"
                );

            }

        }
    );



    /* ======================================
       AGE VALIDATION
    ======================================= */

    const age =
        document.getElementById("age");


    age.addEventListener(
        "input",
        function () {

            if (this.value < 21) {

                this.setCustomValidity(
                    "You must be at least 21 years old."
                );

            }

            else {

                this.setCustomValidity("");

            }

        }
    );



    /* ======================================
       PASSWORD MATCH
    ======================================= */

    const signupForm =
        document.getElementById(
            "signupForm"
        );


    signupForm.addEventListener(
        "submit",
        function(event) {


            /* AGE CHECK */

            if (
                parseInt(age.value) < 21
            ) {

                event.preventDefault();

                alert(
                    "You must be at least 21 years old to create an account."
                );

                age.focus();

                return;

            }


            /* PASSWORD CHECK */

            if (
                password.value !==
                confirmPassword.value
            ) {

                event.preventDefault();

                alert(
                    "Passwords do not match!"
                );

                confirmPassword.focus();

                return;

            }

        }
    );


</script>


</body>
</html>
